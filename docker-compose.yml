services:
  postgres:
    image: postgres:17-alpine
    container_name: samara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: samara
      POSTGRES_PASSWORD: samara
      POSTGRES_DB: samara
    ports:
      - "5432:5432"
    volumes:
      - samara-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samara -d samara"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  samara-pgdata:
